name: Build, Deploy and Release

on:
  push:
    branches: [main, master]
    # Supports the existing numeric tags (for example 1.0 and 2.0), as well as v2.0.
    tags: ["v*", "[0-9]*"]

# Required for creating a GitHub Release and uploading its assets with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  # The deployment pipeline is intentionally limited to branch pushes.  A release
  # tag must package artifacts, but must not deploy them to the production host.
  build-images:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f ./deploy/dockerfiles/Dockerfile -t groupim-server:deploy .

      - name: Build web image
        run: docker build -f ./deploy/dockerfiles/Dockerfile.web -t groupim-web:deploy .

      - name: Export deployment images
        run: |
          mkdir -p release-bundle
          docker image save groupim-server:deploy | gzip > release-bundle/groupim-server-deploy.tar.gz
          docker image save groupim-web:deploy | gzip > release-bundle/groupim-web-deploy.tar.gz

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: deploy-images-${{ github.sha }}
          path: release-bundle/*
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Download deployment bundle
        uses: actions/download-artifact@v4
        with:
          name: deploy-images-${{ github.sha }}
          path: release-bundle

      - name: Prepare remote directories
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p /opt/app/incoming

      - name: Upload deployment bundle to ECS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "release-bundle/groupim-server-deploy.tar.gz,release-bundle/groupim-web-deploy.tar.gz"
          target: /opt/app/incoming
          strip_components: 1
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            docker image load -i /opt/app/incoming/groupim-server-deploy.tar.gz
            docker image load -i /opt/app/incoming/groupim-web-deploy.tar.gz
            docker tag groupim-server:deploy pengpeng163/groupim-server:master
            docker tag groupim-web:deploy pengpeng163/groupim-web:master
            cd /opt/app
            if docker compose version >/dev/null 2>&1; then
              docker compose up -d
            else
              docker-compose up -d
            fi

  release:
    # Create a GitHub Release for tags such as 2.0, 2.0.0, or v2.0.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build server JAR
        run: mvn --batch-mode --no-transfer-progress -pl server -am clean package -DskipTests

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable Android APK
        working-directory: Group-app/Group
        env:
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleDebug \
            -PversionName="${TAG#v}" \
            -PversionCode="${GITHUB_RUN_NUMBER}"

      - name: Assemble release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          SERVER_JAR=$(find server/target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*.jar' | head -n 1)
          APK=$(find Group-app/Group/composeApp/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$SERVER_JAR" && test -f "$SERVER_JAR"
          test -n "$APK" && test -f "$APK"
          cp "$SERVER_JAR" "release-bundle/groupim-server-${TAG}.jar"
          cp "$APK" "release-bundle/groupim-android-${TAG}-debug.apk"
          (
            cd release-bundle
            sha256sum * > SHA256SUMS.txt
          )

      - name: Create GitHub Release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "Group-IM $TAG" \
            --generate-notes \
            release-bundle/*

  notify:
    if: always() && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    needs: [build-images, deploy]
    steps:
      - name: Send DingTalk notification
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          GITHUB_COMMIT: ${{ github.sha }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_AUTHOR: ${{ github.actor }}
        run: |
          if [[ "${{ needs.build-images.result }}" == "success" && "${{ needs.deploy.result }}" == "success" ]]; then
            STATUS="✅ Deployment succeeded"
          elif [[ "${{ needs.build-images.result }}" == "cancelled" || "${{ needs.deploy.result }}" == "cancelled" ]]; then
            STATUS="⚠️ Deployment cancelled"
          else
            STATUS="❌ Deployment failed"
          fi

          MESSAGE="Group-IM update\nStatus: $STATUS\nBranch: $GITHUB_BRANCH\nAuthor: $GITHUB_AUTHOR\nCommit: $GITHUB_COMMIT\nMessage: $GITHUB_COMMIT_MESSAGE"
          curl -sS -X POST "$DINGTALK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$MESSAGE\"}}"
