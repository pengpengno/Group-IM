name: Electron Web PR Validation

on:
  pull_request:
    branches:
      - master
    paths:
      - 'Group-app/Group-Electronjs/**'
      - '.github/workflows/electron-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-web-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Electron and Web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Group-app/Group-Electronjs

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Group-app/Group-Electronjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Electron main and renderer
        run: |
          node scripts/env-info.js --mode desktop --env prod
          npm run app:build

      - name: Build Web bundle
        run: npm run web:build
